<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Campos</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #777;
            padding: 8px 12px;
            text-align: center;
        }

        th {
            background-color: #c0c0c0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Campos</th>
                <th>Type</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nome</td>
                <td>text</td>
            </tr>
            <tr>
                <td>Email</td>
                <td>email</td>
            </tr>
            <tr>
                <td>Senha</td>
                <td>password</td>
            </tr>
            <tr>
                <td>Confirma senha</td>
                <td>password</td>
            </tr>
            <tr>
                <td>Idade</td>
                <td>Radio</td>
            </tr>
            <tr>
                <td>Descrição</td>
                <td>Textarea</td>
            </tr>
            <tr>
                <td>Perfil trabalho</td>
                <td>Select</td>
            </tr>
            <tr>
                <td>Interesses</td>
                <td>checkbox</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
