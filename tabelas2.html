<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        .container {
            display: inline-block;
            border: 1px solid #000;
            padding: 20px;
        }
        td {
            width: 100px;
        }
    </style>
</head>
<body>
   <div class="container">
    <h1>Relatório</h1>
        <table border="1">
            <tr>
                <td style="text-align: center;" colspan="3">Ano: 2023</td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td style="text-align: right;">Valores venda</td>
            </tr>
            <tr>
                <td style="text-align: center;" rowspan="3" colspan="2">Descontos</td>
                <td style="text-align: center;">100.000</td>
            </tr>
            <tr>
                <td style="text-align: center;">200.000</td>
            </tr>
            <tr>
                <td colspan="3" rowspan="2"style="text-align: center;">300.000</td>
            </tr>
            <tr>
                <td></td>
                <td></td>
            </tr>
        </table>

   </div>
</body>
</html>
